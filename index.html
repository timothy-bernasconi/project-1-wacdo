<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>

    <section class="hero" id="section-hero">
        <div class="card">
            <h1 class="mainTitle">Bonjour,</h1>
            <span>Souhaitez-vous consommer votre menu sur place ou préférez-vous l'emporter ?</span>

            <div class="container">
                <div class="choice-card" id="btn-click-1">
                    <img src="./assets/images/illustration-sur-place.png" alt="manger sur place">
                    <h2>Sur Place</h2>
                </div>

                <div class="choice-card" id="btn-click-2">
                    <img src="./assets/images/illustration-a-emporter.png" alt="emporter la commande">
                    <h2>A Emporter</h2>

                </div>
            </div>

        </div>
    </section>

    <div id="cat-container" style="display:none;">
         <img src="assets/images/fleche-slider.png" alt="précédent" id="btn-prev">
         <div id="cat-cards"></div>
         <img src="assets/images/fleche-slider.png" alt="suivant" id="btn-next">

    </div>


    <script src="./index.js"></script>
</body>

</html>
